# Cloudflare PAGES project config (not a Worker).
# Deploy with Pages Git integration, or `npx wrangler pages deploy`.
# `npx wrangler deploy` is the Workers command and fails on this file.
name = "ranco"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# With this file present, Pages reads environment variables from here, not the
# dashboard. To end maintenance (serve 200 instead of 503), uncomment and push:
# [vars]
# MAINTENANCE_MODE = "off"
