<script>
  // Motion is opt-in: content stays visible without JavaScript or with reduced motion.
  // If the motion system has not started within 3 s, show everything anyway.
  (function (d, w) {
    if (w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    d.documentElement.classList.add('motion');
    setTimeout(function () { if (!w.__rancoMotion) d.documentElement.classList.remove('motion'); }, 3000);
  })(document, window);
</script>
</head>
